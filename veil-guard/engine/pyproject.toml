[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "veil-guard-engine"
version = "0.1.0"
description = "Local processing engine contracts for VEIL Guard"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["libs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
