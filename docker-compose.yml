services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: veil
      POSTGRES_USER: veil
      POSTGRES_PASSWORD: veil
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veil -d veil"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - veil-postgres-data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  cloud:
    build:
      context: ./veil-cloud
    env_file:
      - ./veil-cloud/.env
    environment:
      VEIL_HOST: 0.0.0.0
      VEIL_PORT: 8089
      VEIL_REDIS_URL: redis://cache:6379/0
      VEIL_DATABASE_URL: postgresql+psycopg://veil:veil@database:5432/veil
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    ports:
      - "8089:8089"
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app:app --host "$$VEIL_HOST" --port "$$VEIL_PORT"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN in the root .env file}
    command: tunnel --no-autoupdate run --token $$TUNNEL_TOKEN
    depends_on:
      - cloud

volumes:
  veil-postgres-data: